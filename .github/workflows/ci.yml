name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire reviewed Nix installer without executing it
        run: |
          ! command -v nix
          test ! -e /nix/var/nix/profiles/default/bin/nix
          curl --fail --silent --show-error --proto '=https' --max-time 60 \
            https://releases.nixos.org/nix/nix-2.35.2/install -o "$RUNNER_TEMP/nix-install"
          printf '9adda97297d9e8ab360df95c729eabff4f4f93d6db091953c3a68f29e3fb130c  %s\n' "$RUNNER_TEMP/nix-install" | sha256sum -c -
      - name: Install reviewed Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: file://${{ runner.temp }}/nix-install
          enable_kvm: false
          extra_nix_config: |
            accept-flake-config = true
            access-tokens =
      - name: Remove bootstrap token configuration and build pinned runtime without credentials
        run: |
          test "$(nix --version)" = 'nix (Nix) 2.35.2'
          # The pinned composite action supplies github.token internally. Remove
          # every token declaration before any flake evaluation/build, including daemon config.
          sudo sed -i '/^[[:space:]]*access-tokens[[:space:]]*=/d' /etc/nix/nix.conf
          if test -f "$HOME/.config/nix/nix.conf"; then
            sed -i '/^[[:space:]]*access-tokens[[:space:]]*=/d' "$HOME/.config/nix/nix.conf"
          fi
          sudo systemctl restart nix-daemon.service
          unset GH_TOKEN GITHUB_TOKEN NIX_CONFIG NIX_USER_CONF_FILES
          for key in ${!ORG_GRADLE_PROJECT_@}; do unset "$key"; done
          test -z "$(nix config show access-tokens)"
          nix build --no-update-lock-file --no-write-lock-file .#release-runtime --out-link "$RUNNER_TEMP/release-runtime"
          runtime="$(readlink -f "$RUNNER_TEMP/release-runtime")"
          printf '%s/bin\n' "$runtime" >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s/lib/openjdk\nTOTIPO_PUBLICATION_TOOL=%s/bin/totipo-java-tool\nRELEASE_GIT=%s/bin/git\nRELEASE_CURL=%s/bin/curl\nSSL_CERT_FILE=%s/etc/ssl/certs/ca-bundle.crt\n' \
            "$runtime" "$runtime" "$runtime" "$runtime" "$runtime" >> "$GITHUB_ENV"
      - name: Verify wrapper and actual workflow guardrails
        run: |
          totipo-wrapper-verifier gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          totipo-java-tool release workflow-pins "$PWD"
      - name: Qualify Java libraries and publication artifacts
        run: nix flake check --no-update-lock-file --no-write-lock-file --print-build-logs
