name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed VERSION
        required: true
        type: string
      commit:
        description: Exact lowercase 40-character reviewed source SHA
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REQUESTED_VERSION: ${{ inputs.version }}
  REQUESTED_COMMIT: ${{ inputs.commit }}
  DISPATCH_REF: ${{ github.ref }}
  DISPATCH_SHA: ${{ github.sha }}
  GRADLE_OPTS: -Dorg.gradle.configuration-cache=false -Dorg.gradle.daemon=false

concurrency:
  group: release-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      commit: ${{ steps.inputs.outputs.commit }}
      inventory: ${{ steps.inventory.outputs.inventory }}
    steps:
      - name: Validate bounded inputs before checkout
        id: inputs
        run: |
          test "${#REQUESTED_VERSION}" -le 128
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
          [[ "${REQUESTED_VERSION^^}" != *-SNAPSHOT ]]
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          test "$DISPATCH_SHA" = "$REQUESTED_COMMIT"
          printf 'version=%s\ncommit=%s\n' "$REQUESTED_VERSION" "$REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.inputs.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate checkout before executing its tooling
        run: |
          test "$GITHUB_REPOSITORY" = totipo-org/totipo-java
          test "$(git --no-replace-objects rev-parse HEAD)" = "$REQUESTED_COMMIT"
          printf '%s\n' "$REQUESTED_VERSION" | cmp - VERSION
          test -z "$(git status --porcelain --untracked-files=all)"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_TERMINAL_PROMPT=0
          git -c credential.helper= -c core.hooksPath=/dev/null -c http.followRedirects=false fetch \
            --no-tags --no-recurse-submodules -- https://github.com/totipo-org/totipo-java.git \
            +refs/heads/main:refs/remotes/release/main
          git merge-base --is-ancestor "$REQUESTED_COMMIT" refs/remotes/release/main
      - name: Setup pinned Nix
        uses: $/.github/actions/setup-nix
      - name: Build pinned runtime without credentials
        run: |
          unset GH_TOKEN GITHUB_TOKEN NIX_CONFIG NIX_USER_CONF_FILES
          for key in ${!ORG_GRADLE_PROJECT_@}; do unset "$key"; done
          nix build --no-update-lock-file --no-write-lock-file .#release-runtime --out-link "$RUNNER_TEMP/release-runtime"
          runtime="$(readlink -f "$RUNNER_TEMP/release-runtime")"
          printf '%s/bin\n' "$runtime" >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s/lib/openjdk\nTOTIPO_PUBLICATION_TOOL=%s/bin/totipo-java-tool\nRELEASE_GIT=%s/bin/git\nRELEASE_CURL=%s/bin/curl\nSSL_CERT_FILE=%s/etc/ssl/certs/ca-bundle.crt\n' \
            "$runtime" "$runtime" "$runtime" "$runtime" "$runtime" >> "$GITHUB_ENV"
      - name: Verify wrapper and actual workflow guardrails
        run: |
          totipo-wrapper-verifier gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          totipo-java-tool release workflow-pins "$PWD"
      - name: Check initial source and release eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: totipo-java-tool release initial "$PWD"
      - name: Exact-source hermetic qualification
        run: nix flake check --no-update-lock-file --no-write-lock-file --print-build-logs
      - name: Normal and independent forced offline release qualification
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean test build javadoc verifyPublication consumerSmoke
          totipo-java-tool release test-results "$PWD"
          cp -r core/build/test-results "$RUNNER_TEMP/normal-core-results"
          cp -r storage-nio/build/test-results "$RUNNER_TEMP/normal-storage-results"
          cp build/publication-manifest.json "$RUNNER_TEMP/normal-manifest.json"
          ./gradlew --offline --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks clean test build javadoc verifyPublication consumerSmoke
          totipo-java-tool release test-results "$PWD"
          cp -r core/build/test-results "$RUNNER_TEMP/offline-core-results"
          cp -r storage-nio/build/test-results "$RUNNER_TEMP/offline-storage-results"
          export EXPECTED_INVENTORY="$(cat "$RUNNER_TEMP/normal-manifest.json")"
          totipo-java-tool release compare "$PWD" "$PWD/build/repository" "$PWD/build/publication-manifest.json"
          ./gradlew -p publishing/consumer-smoke --offline -PpomOnly clean check
      - name: Focused snapshot and profile accounting
        run: |
          ./gradlew :core:test --tests org.totipo.conformance.SpecSnapshotIntegrityTest --tests org.totipo.conformance.R19ProfileIntegrityTest
          totipo-java-tool release focused-test-results "$PWD"
          (cd core/src/test/resources/totipo-spec/v1-pre-rc && sha256sum -c SNAPSHOT.sha256)
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record independently accepted ten-artifact inventory
        id: inventory
        run: |
          inventory="$(totipo-java-tool release inventory "$PWD" "$PWD/build/repository")"
          printf 'inventory=%s\n' "$inventory" >> "$GITHUB_OUTPUT"

  publish-central:
    # J4B ACTIVATION GUARD: only a separately reviewed source change may enable mutation.
    if: ${{ false && github.run_attempt == 1 }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    environment: release
    env:
      EXPECTED_INVENTORY: ${{ needs.preflight.outputs.inventory }}
    steps:
      - name: Validate bounded inputs before checkout
        id: inputs
        run: |
          test "${#REQUESTED_VERSION}" -le 128
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]
          [[ "${REQUESTED_VERSION^^}" != *-SNAPSHOT ]]
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCH_REF" = refs/heads/main
          printf 'version=%s\ncommit=%s\n' "$REQUESTED_VERSION" "$REQUESTED_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.inputs.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate checkout before executing its tooling
        run: |
          test "$GITHUB_REPOSITORY" = totipo-org/totipo-java
          test "$(git --no-replace-objects rev-parse HEAD)" = "$REQUESTED_COMMIT"
          printf '%s\n' "$REQUESTED_VERSION" | cmp - VERSION
          test -z "$(git status --porcelain --untracked-files=all)"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_TERMINAL_PROMPT=0
          git -c credential.helper= -c core.hooksPath=/dev/null -c http.followRedirects=false fetch \
            --no-tags --no-recurse-submodules -- https://github.com/totipo-org/totipo-java.git \
            +refs/heads/main:refs/remotes/release/main
          git merge-base --is-ancestor "$REQUESTED_COMMIT" refs/remotes/release/main
      - name: Setup pinned Nix
        uses: $/.github/actions/setup-nix
      - name: Build pinned runtime without credentials
        run: |
          unset GH_TOKEN GITHUB_TOKEN NIX_CONFIG NIX_USER_CONF_FILES
          for key in ${!ORG_GRADLE_PROJECT_@}; do unset "$key"; done
          nix build --no-update-lock-file --no-write-lock-file .#release-runtime --out-link "$RUNNER_TEMP/release-runtime"
          runtime="$(readlink -f "$RUNNER_TEMP/release-runtime")"
          printf '%s/bin\n' "$runtime" >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s/lib/openjdk\nTOTIPO_PUBLICATION_TOOL=%s/bin/totipo-java-tool\nRELEASE_GIT=%s/bin/git\nRELEASE_CURL=%s/bin/curl\nSSL_CERT_FILE=%s/etc/ssl/certs/ca-bundle.crt\n' \
            "$runtime" "$runtime" "$runtime" "$runtime" "$runtime" >> "$GITHUB_ENV"
      - name: Verify wrapper and actual workflow guardrails
        run: |
          totipo-wrapper-verifier gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          totipo-java-tool release workflow-pins "$PWD"
      - name: Independently rebuild and authenticate publication inputs without secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          totipo-java-tool release eligible "$PWD"
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache clean verifyPublication
          totipo-java-tool release compare "$PWD" "$PWD/build/repository" "$PWD/build/publication-manifest.json"
      - name: Reserve first-time tag then sign, bind inputs and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]]; then unset ORG_GRADLE_PROJECT_signingInMemoryKeyId; fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]]; then unset ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; fi
          totipo-java-tool release compare "$PWD" "$PWD/build/repository" "$PWD/build/publication-manifest.json"
          totipo-java-tool release reserve "$PWD"
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache -PcentralRelease=true :core:signMavenPublication :storage-nio:signMavenPublication
          totipo-java-tool release tagged "$PWD"
          totipo-java-tool release signed "$PWD" "$PWD/build/repository" "$PWD/build/publication-manifest.json"
          # Freeze accepted producer/signing tasks; the Gradle publication boundary rechecks all inputs.
          export ORG_GRADLE_PROJECT_centralUpload=true
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache -PcentralRelease=true publishAndReleaseToMavenCentral

  call-verification:
    needs: [preflight, publish-central]
    permissions:
      contents: write
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      commit: ${{ needs.preflight.outputs.commit }}
